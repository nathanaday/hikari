# Releases a version when its tag is pushed. make version builds the release on your
# machine and pins its checksums into the plugin's launcher; this workflow builds the
# tagged commit again, the same way on every machine, and stops when its bytes differ
# from the pins, since the launcher installs only those bytes. Then it attests the
# binaries and publishes them as the release of the tag.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Check that the tag is the plugin's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json | head -1)
          if [ "$TAG" != "$version" ]; then
            echo "The tag $TAG is not the plugin's version, $version. Set it with make version V=$TAG."
            exit 1
          fi

      - run: make release

      - name: Check the binaries against the checksums the plugin pins
        run: |
          if ! diff -u plugin/release/checksums.txt build/release/checksums.txt; then
            echo "The build of $GITHUB_REF_NAME differs from plugin/release/checksums.txt. Run make pin on the tagged commit, commit, and tag again."
            exit 1
          fi

      - run: go vet ./...
      - run: go test ./...

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/release/hikari-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --verify-tag \
            --title "Hikari $VERSION" \
            --notes "The hikari binary of $VERSION for macOS and Linux. The Claude Code plugin installs the one for your machine, with the Linux binaries that hikari mounts into its containers; see the README. Each file's sha256 is in checksums.txt, and \`gh attestation verify <file> --repo nathanaday/hikari\` checks its provenance." \
            build/release/hikari-* build/release/checksums.txt
