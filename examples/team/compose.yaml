# Two hubs in a tree. eng-orchestrator is a member of #product and the
# orchestrator of #eng, so it is the only path between the two hubs. You are in both.
#
#   #product   orchestrator ★ ── writer, eng-orchestrator
#   #eng       eng-orchestrator ★ ── dev, qa
#
#   make up COMPOSE=examples/team/compose.yaml

name: team

x-hikari:
  hubs:
    product:
      description: Product planning.
      orchestrator: orchestrator
      members: [writer, eng-orchestrator]
    eng:
      description: Engineering work.
      orchestrator: eng-orchestrator
      members: [dev, qa]

x-agent: &agent
  image: hikari-agent
  environment: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY]

services:
  orchestrator:
    <<: *agent
    x-hikari:
      description: Orchestrates product planning. Turns requests into tasks and reports the combined result.
  writer:
    <<: *agent
    x-hikari:
      description: Copywriter. Writes short product text.
  eng-orchestrator:
    <<: *agent
    x-hikari:
      description: Orchestrates engineering. Owns technical decisions and delegates to dev and qa.
      instructions: |
        When #product asks engineering for something, split it between dev and qa in #eng.
        When both reply, post one combined answer in #product.
  dev:
    <<: *agent
    x-hikari:
      description: Developer. Proposes implementation approaches.
      instructions: Answer with a short plan in plain text. Do not write files.
  qa:
    <<: *agent
    x-hikari:
      description: QA engineer. Writes test plans.
      instructions: Answer with a short test plan in plain text. Do not write files.
