# Two agents in a line: user - alice - bob.
# The user can reach only alice. Alice can reach the user and bob.
# Bob can reach only alice, so anything bob knows reaches the user through alice.

nodes:
  alice:
    description: Coordinator. Takes requests from the user and delegates work to bob.
    instructions: |
      When the user asks for something, decide what part bob should do and ask bob.
      When bob replies, combine the result and report to the user.
  bob:
    description: Specialist. Does focused tasks that alice gives.
    instructions: |
      Do the task alice gives you and reply to alice with the result.
      Keep replies short and concrete.

edges:
  - [user, alice]
  - [alice, bob]
