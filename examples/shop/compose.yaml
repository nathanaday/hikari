# A shop with two systems in one repo. lead plans from the system maps and
# never sees code. orders and inventory each own one directory of the repo.
# orders can read inventory's releases, so it can test against the real
# stock library once inventory publishes it. orders also has a sidecar, a
# small web server that only orders can reach, at http://orders-mock:8000.
#
# Create the repo and the store first, then start the network:
#   make demo-repo
#   make up COMPOSE=examples/shop/compose.yaml

name: shop

x-hikari:
  repos:
    shop: {path: ../../.hikari/demo/shop, branch: hikari/demo}
  hubs:
    shop:
      description: Builds the shop.
      orchestrator: lead
      members: [orders, inventory]

x-agent: &agent
  environment: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY]

services:
  lead:
    <<: *agent
    image: hikari-agent
    x-hikari:
      description: Product lead for the shop. Plans changes from the system maps.

  orders:
    <<: *agent
    build: {context: ., dockerfile: python.Dockerfile}
    x-hikari:
      description: Owns order intake.
      system:
        repo: shop
        scope: services/orders
        test: python3 -m unittest discover -s tests
      grants:
        releases: [inventory]

  inventory:
    <<: *agent
    build: {context: ., dockerfile: python.Dockerfile}
    x-hikari:
      description: Owns stock levels and reservations.
      system:
        repo: shop
        scope: services/inventory
        test: python3 -m unittest discover -s tests

  orders-mock:
    image: python:3.12-slim
    command: [python3, -m, http.server, "8000"]
    init: true                    # so that the server stops at once on Ctrl-C
    x-hikari: {serves: orders}
