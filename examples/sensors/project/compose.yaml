# The sensors example: four systems, an orchestrator, and a tester.
#   make example-sensors
#   make up COMPOSE=.hikari/demo/sensors/compose.yaml

name: sensors

x-hikari:
  project: {branch: hikari}
  hubs:
    main:
      description: Builds a sensor monitoring product, from the edge to the console.
      orchestrator: orchestrator
      members: [edge, cloud, console, thresholds, sensors-e2e]

x-agent: &agent
  environment: [CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY]

x-python: &python
  <<: *agent
  build: {context: ., dockerfile: python.Dockerfile}

services:
  orchestrator:
    <<: *agent
    image: hikari-agent
    x-hikari:
      description: Orchestrates the product. Keeps the hub's stories, rules, and principles, and plans from the system maps.

  edge:
    <<: *agent
    build: {context: ., dockerfile: go.Dockerfile}
    x-hikari:
      description: Owns the edge program, which reads sensors and sends their readings to the cloud.
      system: {repo: project, scope: edge, test: go test -v ./... 2>&1 | go-junit-report > /hikari/private/reports/all.xml}
      grants: {deliverables: [linux-tarball]}

  cloud:
    <<: *python
    x-hikari:
      description: Owns the cloud service, which stores readings, opens incidents, and mails the operator.
      system: {repo: project, scope: cloud, test: python3 -m pytest -q tests -o junit_family=xunit1 --junitxml=/hikari/private/reports/all.xml}
      grants: {deliverables: [http-service], releases: [thresholds]}

  console:
    <<: *python
    x-hikari:
      description: Owns the operator's web console, which shows the incidents.
      system: {repo: project, scope: console, test: python3 -m pytest -q tests -o junit_family=xunit1 --junitxml=/hikari/private/reports/all.xml}
      grants: {deliverables: [static-site]}

  thresholds:
    <<: *python
    x-hikari:
      description: Owns the threshold of each sensor.
      system: {repo: project, scope: thresholds, test: python3 -m pytest -q tests -o junit_family=xunit1 --junitxml=/hikari/private/reports/all.xml}
      grants: {deliverables: [data-files]}

  sensors-e2e:
    <<: *python
    x-hikari:
      description: Proves the stories of #main against the releases of its systems, with the services running in an environment.
      system: {repo: project, scope: e2e/main}
      tests: main
