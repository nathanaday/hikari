# The test map of the shop's inventory partition. Its three tests live in one
# file. Every test asserts what is available, so every test touches
# check-availability. The file key gives the links of the two reserve tests,
# and an id key gives the restock test its own.
version: 1
suites:
  all:
    command: python3 -m pytest -q shop/services/inventory/tests -o pythonpath=shop/services/inventory -p no:cacheprovider -o junit_family=xunit1 --junitxml=/hikari/private/reports/all.xml
    description: Every test of the partition. No network.
tests:
  shop/services/inventory/tests/test_stock.py: ["[[reserve-stock]]", "[[check-availability]]"]
  "shop.services.inventory.tests.test_stock.StockTest > test_restock_adds_stock": ["[[restock-sku]]", "[[check-availability]]"]
gaps:
  reserve-stock: [A quantity that is not positive is not tested.]
  restock-sku: [A quantity that is not positive is not tested.]
  check-availability: [An unknown SKU is not tested.]
